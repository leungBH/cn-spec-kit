<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考勤打卡 - cn-spec-kit Demo</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <style>
    body { background: #f5f6f9; }
    .header-mobile { background: linear-gradient(135deg, #1890ff, #40a9ff); color: #fff; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header-mobile h1 { font-size: 18px; font-weight: 500; }
    .header-mobile a { color: #fff; text-decoration: none; font-size: 13px; opacity: 0.9; }
    .header-mobile a:hover { opacity: 1; }
    .datetime { padding: 30px 20px 20px; text-align: center; background: #fff; }
    .date { font-size: 14px; color: var(--text-sub); margin-bottom: 8px; }
    .time { font-size: 44px; font-weight: 600; color: var(--text); letter-spacing: 2px; font-family: "Courier New", monospace; }
    .location { margin: 16px; padding: 16px; background: #f0f9ff; border-radius: 8px; border-left: 4px solid var(--primary); display: flex; align-items: center; justify-content: space-between; }
    .location .info .name { font-size: 15px; color: var(--text); margin-bottom: 4px; }
    .location .info .status { font-size: 12px; color: var(--success); }
    .location .refresh { background: transparent; border: none; cursor: pointer; font-size: 18px; color: var(--primary); }
    .status-list { margin: 0 16px 16px; }
    .status-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #fafbfc; border-radius: 6px; margin-bottom: 8px; }
    .status-item .label { color: var(--text-sub); font-size: 14px; }
    .status-item .value { font-weight: 500; font-size: 14px; }
    .status-item.normal .value { color: var(--success); }
    .status-item.late .value { color: var(--danger); }
    .status-item.pending .value { color: var(--warning); }
    .clock-btn { display: block; width: calc(100% - 32px); margin: 16px; padding: 16px; background: linear-gradient(135deg, #1890ff, #40a9ff); color: #fff; text-align: center; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; border: none; }
    .clock-btn:disabled { background: #ccc; cursor: not-allowed; }
    .clock-btn:active { transform: scale(0.98); }
    .quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 16px; }
    .quick-actions a { display: flex; flex-direction: column; align-items: center; padding: 12px 4px; background: #fff; border-radius: 6px; text-decoration: none; color: var(--text); font-size: 12px; }
    .quick-actions a:hover { background: var(--primary-light); }
    .quick-actions .qa-icon { font-size: 22px; margin-bottom: 4px; }
    .footer-bar { display: flex; justify-content: space-around; padding: 12px 0; background: #fff; border-top: 1px solid var(--border); position: sticky; bottom: 0; }
    .footer-bar a { flex: 1; text-align: center; text-decoration: none; color: var(--text-sub); font-size: 12px; padding: 4px 0; }
    .footer-bar a.active, .footer-bar a:hover { color: var(--primary); }
    .footer-bar .fi { display: block; font-size: 20px; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="header-mobile">
      <h1>考勤打卡</h1>
      <a href="approve.html" onclick="return handleNav(event, 'approve.html')">▣ 审批端</a>
    </div>
    <div class="datetime">
      <div class="date" id="date">2026-06-18 星期四</div>
      <div class="time" id="time">08:25:30</div>
    </div>
    <div class="location">
      <div class="info">
        <div class="name">▦ 总厂区 A 区</div>
        <div class="status" id="locStatus">▦ 在打卡范围内 ✓</div>
      </div>
      <button class="refresh" onclick="refreshLocation()" title="刷新定位">↻</button>
    </div>
    <div class="status-list" id="statusList">
      <div class="status-item normal">
        <span class="label">▣ 上班卡</span>
        <span class="value" id="s1">✅ 08:01 (正常)</span>
      </div>
      <div class="status-item pending">
        <span class="label">▦ 午休出</span>
        <span class="value" id="s2">⏳ 待打卡</span>
      </div>
      <div class="status-item pending">
        <span class="label">▦ 午休入</span>
        <span class="value" id="s3">⏳ 待打卡</span>
      </div>
      <div class="status-item pending">
        <span class="label">▣ 下班卡</span>
        <span class="value" id="s4">⏳ 待打卡</span>
      </div>
    </div>
    <button class="clock-btn" id="clockBtn" onclick="doClock()">📷 拍照并打卡</button>
    <div class="quick-actions">
      <a href="#" onclick="event.preventDefault(); openLeave(); return false;">
        <span class="qa-icon">▦</span>
        <span>请假申请</span>
      </a>
      <a href="#" onclick="event.preventDefault(); openRepair(); return false;">
        <span class="qa-icon">▤</span>
        <span>补卡申请</span>
      </a>
      <a href="#" onclick="event.preventDefault(); openOvertime(); return false;">
        <span class="qa-icon">▥</span>
        <span>加班申请</span>
      </a>
      <a href="report.html" onclick="return handleNav(event, 'report.html')">
        <span class="qa-icon">▧</span>
        <span>我的考勤</span>
      </a>
    </div>
    <div style="height: 20px"></div>
    <div class="footer-bar">
      <a href="index.html" class="active"><span class="fi">⌂</span>首页</a>
      <a href="#" onclick="event.preventDefault(); openLeave(); return false;"><span class="fi">▦</span>申请</a>
      <a href="report.html" onclick="return handleNav(event, 'report.html')"><span class="fi">▧</span>报表</a>
      <a href="#" onclick="event.preventDefault(); showToast('个人中心 - 演示'); return false;"><span class="fi">●</span>我的</a>
    </div>
  </div>

  <!-- 打卡确认弹窗 -->
  <div class="modal-mask" id="clockModal">
    <div class="modal">
      <div class="modal-head">📷 拍照打卡确认</div>
      <div class="modal-body">
        <p>请确认在厂区 200 米范围内，点击确认完成打卡。</p>
        <div style="margin-top: 12px; padding: 12px; background: #f5f5f5; border-radius: 4px; font-size: 13px; color: var(--text-sub);">
          <div>▦ 定位：总厂区 A 区</div>
          <div>▦ 时间：<span id="modalTime"></span></div>
          <div>▦ 距离：38 米</div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeModal('clockModal')">取消</button>
        <button class="btn btn-primary" onclick="confirmClock()">确认打卡</button>
      </div>
    </div>
  </div>

  <script>
    // 实时更新时间
    function updateTime() {
      const now = new Date();
      const week = ['日','一','二','三','四','五','六'][now.getDay()];
      const dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' 星期' + week;
      const timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
      document.getElementById('date').textContent = dateStr;
      document.getElementById('time').textContent = timeStr;
    }
    updateTime();
    setInterval(updateTime, 1000);

    // 跨页面导航（演示用）
    function handleNav(e, target) {
      e.preventDefault();
      showToast('正在跳转到 ' + target);
      setTimeout(() => { window.location.href = target; }, 400);
      return false;
    }

    // 刷新定位
    function refreshLocation() {
      showToast('正在获取定位...');
      setTimeout(() => {
        document.getElementById('locStatus').innerHTML = '▦ 在打卡范围内 ✓';
        showToast('定位成功：总厂区 A 区');
      }, 800);
    }

    // 打卡按钮
    function doClock() {
      const now = new Date();
      document.getElementById('modalTime').textContent = now.toLocaleString('zh-CN');
      openModal('clockModal');
    }

    function confirmClock() {
      closeModal('clockModal');
      showToast('打卡成功 ✓');
      // 简单模拟：根据当前时间更新对应打卡点
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();
      const hm = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
      let target = 's2';
      if (h < 12) target = 's1';
      else if (h < 14) target = 's2';
      else if (h < 18) target = 's3';
      else target = 's4';
      const el = document.getElementById(target);
      if (el) {
        el.textContent = '✅ ' + hm + ' (正常)';
        el.parentElement.className = 'status-item normal';
      }
    }

    // 快速申请入口
    function openLeave() { showToast('正在打开请假申请...'); setTimeout(() => showToast('（演示）请假申请表单'), 600); }
    function openRepair() { showToast('正在打开补卡申请...'); setTimeout(() => showToast('（演示）补卡申请表单'), 600); }
    function openOvertime() { showToast('正在打开加班申请...'); setTimeout(() => showToast('（演示）加班申请表单'), 600); }
  </script>
</body>
</html>
